grumphp:
    # 60с-дефолт іноді замалий під навантаженням хоста (Larastan бутить весь Laravel-app).
    process_timeout: 180.0

    # Хости не мають PHP — усі таски виконуються в контейнері app.
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: "docker compose exec -T -u www-data app"

    tasks:
        git_commit_message:
            allow_empty_message: false
            enforce_capitalized_subject: false
            max_subject_width: 72
            type_scope_conventions:
                types: ["feat", "fix", "refactor", "docs", "test", "chore", "style", "perf"]

        phpstan:
            configuration: phpstan.neon
            use_grumphp_paths: false

        deptrac:
            depfile: deptrac.yaml

        shell:
            scripts:
                - ["-c", "vendor/bin/pint --test"]
