deptrac:
    paths:
        - ./app

    exclude_files:
        - '#.*test.*#'

    layers:
        - name: Models
          collectors:
              - type: classNameRegex
                value: '#^App\\Infrastructure\\Persistence\\Eloquent\\Models\\.*#'

        - name: Application
          collectors:
              - type: classNameRegex
                value: '#^App\\Application\\.*#'

        - name: Infrastructure
          collectors:
              - type: classNameRegex
                value: '#^App\\Infrastructure\\(?!Persistence\\Eloquent\\Models\\).*#'

        - name: Providers
          collectors:
              - type: classNameRegex
                value: '#^App\\Providers\\.*#'

    # Models — спільний "нижній" шар без окремого Domain (свідоме рішення, §CLAUDE.md
    # "Архітектура"): Eloquent-моделі як типи-носії даних, не адаптери. Не залежить ні від
    # чого з наших шарів. Application може типізувати Ports через Models — це НЕ витік у
    # Infrastructure (адаптери/контролери/Job), лише спільний словник даних.
    #
    # Application нічого не знає про Infrastructure (адаптери) — лише про власні Ports + Models.
    # Infrastructure реалізує Ports Application-шару, тому знає про нього (+ Models).
    # Providers — composition root, легітимний виняток: знає про все.
    ruleset:
        Models: []
        Application:
            - Models
        Infrastructure:
            - Application
            - Models
        Providers:
            - Application
            - Infrastructure
            - Models
